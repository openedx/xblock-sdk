[tox]
envlist = py312-django{42,52},quality
requires = tox-uv>=1

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pytest]
DJANGO_SETTINGS_MODULE = workbench.settings
addopts = --cov workbench --cov sample_xblocks --cov-report term-missing --cov-report xml
norecursedirs = .* doc bin prototype screenshots requirements

[testenv]
runner = uv-venv-lock-runner
allowlist_externals =
    make
dependency_groups =
    django42: django42
    django52: test
passenv =
    DISPLAY
commands =
    make var/workbench.db
    python -Wd -m pytest {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups =
    quality
commands =
    pylint src/workbench src/sample_xblocks
    isort --check-only src/workbench src/sample_xblocks
